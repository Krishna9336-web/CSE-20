<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    padding: 0;
    text-align: center;
}

h1 {
    margin-top: 30px;
    color: #333;
}

/* Table Styling */
table {
    margin: 30px auto;
    border-collapse: collapse;
    width: 70%;
    background-color: #ffffff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 12px 18px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

th {
    background-color: #4CAF50;
    color: white;
    font-size: 16px;
    letter-spacing: 1px;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

tr:hover {
    background-color: #d1e7dd;
    transition: 0.3s;
}

    </style>
</head>

<body>
    <h1>Table in HTML</h1>
    <table>
        <thead>
            <tr>
                <th>NAME</th>
                <TH>ROLL NO.</TH>
                <TH>COURSE</TH>
            </tr>
        </thead>
        <tbody>
            <TR>
                <TD>KRISHNA KASHYAP</TD>
                <TD>26</TD>
                <TD>B-TECH</TD>
            </TR>
            <TR>
                <TD>RAJAT TRIPATHI</TD>
                <TD>29</TD>
                <TD>B-TECH</TD>
            </TR>
            <TR>
                <TD>SATYAM CHAURASIYA</TD>
                <TD>23</TD>
                <TD>B-TECH</TD>
            </TR>
            <TR>
            <TD>KRISHNA KUMAR BARNAWAL</TD>
            <TD>28</TD>
            <TD>B-TECH</TD>
            </TR>
        </tbody>

    </table>
</body>

</html>
